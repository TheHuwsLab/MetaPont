[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MetaPont"
version = "0.1.2"
authors = [
    { name = "Nicholas Dimonaco", email = "nicholas@dimonaco.co.uk" }
]
description = "Integrated analysis of metagenomic assembly, readmapping, Kraken2 and eggNOG-mapper outputs."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
keywords = ["metagenomics", "bioinformatics", "genomics", "Kraken2", "eggNOG-mapper", "readmapping"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/TheHuwsLab/MetaPont"
"Bug Tracker" = "https://github.com/TheHuwsLab/MetaPont/issues"

[project.scripts]
metapont = "MetaPont.cli:main"
metapont-combine = "MetaPont.compat:combine_main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["MetaPont*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
